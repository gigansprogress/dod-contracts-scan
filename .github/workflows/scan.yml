name: DOD Contract Scan

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Google Chrome and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv run playwright install chromium

      - name: Write .env
        run: |
          cat > .env <<EOF
          LLM_PROVIDER=anthropic
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_MODEL=claude-haiku-4-5-20251001
          MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
          DATABASE_PATH=./dod_scan.db
          OUTPUT_DIR=./output
          LOG_DIR=./logs
          EOF

      - name: Check Mapbox token type
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          case "$MAPBOX_TOKEN" in
            pk.*) echo "Mapbox token is a public pk. token - OK" ;;
            *) echo "MAPBOX_TOKEN must start with pk. (check for stray spaces or quotes)"; exit 1 ;;
          esac

      - name: Initialize database if missing
        run: |
          if [ ! -f dod_scan.db ]; then
            uv run dod-scan init-db
          fi

      - name: Run pipeline
        run: xvfb-run -a uv run dod-scan run-all --format all

      - name: Check HTML for secret tokens
        run: |
          echo "Line 278 context (long strings redacted):"
          sed -n '278p' output/dod_contracts.html | sed -E 's/[A-Za-z0-9_.-]{20,}/[redacted]/g'
          if grep -qE '(^|[^A-Za-z0-9])sk\.ey' output/dod_contracts.html; then
            echo "Found an sk. secret token in the HTML - not publishing"
            exit 1
          fi
          echo "No sk. token found in HTML"

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp output/dod_contracts.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dod_scan.db logs/ output/ ':(exclude)output/*.html' || true
          git diff --staged --quiet || git commit -m "Automated scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
